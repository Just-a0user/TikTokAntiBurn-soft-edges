name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found: $APK"
          mkdir -p out
          cp "$APK" out/TikTokAntiBurn-soft-edge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokAntiBurn-soft-edge-apk
          path: out/TikTokAntiBurn-soft-edge.apk

      - name: Publish as release (direct download on phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="soft-edge-build-${{ github.run_number }}"
          gh release create "$TAG" out/TikTokAntiBurn-soft-edge.apk \
            --title "Soft edge build ${{ github.run_number }}" \
            --notes "Debug build with soft edge slider (Additional settings)."
