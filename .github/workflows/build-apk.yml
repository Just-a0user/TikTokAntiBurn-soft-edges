name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found: $APK"
          mkdir -p out
          cp "$APK" out/TikTokAntiBurn-soft-edge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokAntiBurn-soft-edge-apk
          path: out/TikTokAntiBurn-soft-edge.apk

      # Creates a GitHub release for the version in RELEASE_TAG (only if that release does not exist yet).
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(tr -d '[:space:]' < RELEASE_TAG)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do (change RELEASE_TAG for a new release)."
          else
            gh release create "$TAG" out/TikTokAntiBurn-soft-edge.apk \
              --target "$GITHUB_SHA" \
              --title "TikTok AntiBurn – Soft Edge $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
