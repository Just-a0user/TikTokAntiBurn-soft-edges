name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "Found: $APK"
          mkdir -p out
          cp "$APK" out/TikTokAntiBurn-soft-edge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokAntiBurn-soft-edge-apk
          path: out/TikTokAntiBurn-soft-edge.apk

      # A release is only created when a version tag (v*) is pushed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" out/TikTokAntiBurn-soft-edge.apk \
            --title "TikTok AntiBurn – Soft Edge ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
